<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#059669" stroke-width="4" stroke-dasharray="16 12" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="150" fill="#047857" fill-opacity="0.1"/>

  <!-- High-Frequency Pulse Waveform -->
  <path d="M 110 256 L 180 256 L 210 180 L 256 332 L 302 210 L 332 256 L 402 256" 
        fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" filter="url(#glow)"/>

  <!-- Quantum Lightning Core -->
  <polygon points="275,115 190,265 250,265 235,395 325,245 265,245" 
           fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Corner Status Dots -->
  <circle cx="80" cy="80" r="12" fill="#34d399"/>
  <circle cx="432" cy="80" r="8" fill="#10b981" opacity="0.6"/>
  <circle cx="432" cy="432" r="12" fill="#34d399"/>
  <circle cx="80" cy="432" r="8" fill="#10b981" opacity="0.6"/>
</svg>
